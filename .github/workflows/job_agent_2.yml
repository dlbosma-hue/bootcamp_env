name: Daily Job Digest (AI PM)

on:
  schedule:
    # NOTE: GitHub's scheduler has been delaying this repo's runs by 4-7
    # hours every day (checked via the Actions API — nominal 07:00/08:00 UTC
    # trigger, actual runs land 11:00-14:39 UTC). GitHub explicitly warns that
    # cron jobs scheduled exactly on the hour hit the busiest queue slot and
    # can be delayed under load; offsetting the minute (here :12) reduces
    # that queuing delay, though it can't guarantee an exact local time.
    # A previous version tried to hard-pin this to 09:00 Berlin with a
    # skip-unless-exact-hour gate — given the observed multi-hour delays,
    # that gate would have silently skipped the run almost every day, so it
    # was removed. If exact daily timing becomes critical, trigger this via
    # an external scheduler (e.g. cron-job.org) calling the GitHub API
    # workflow_dispatch endpoint instead of relying on GitHub's own cron.
    - cron: '12 7 * * *'
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit jobs.db back

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Projects/job_agent_2/requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run job pipeline
        working-directory: Projects/job_agent_2
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS:   ${{ secrets.JA2_EMAIL_ADDRESS }}
          EMAIL_PASSWORD:  ${{ secrets.JA2_EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.JA2_EMAIL_TO }}
          SMTP_HOST:       ${{ secrets.JA2_SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.JA2_SMTP_PORT }}
        run: python pipeline.py

      - name: Commit updated jobs.db
        working-directory: Projects/job_agent_2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || git commit -m "chore: update jobs.db [skip ci]"
          git pull --rebase
          git push

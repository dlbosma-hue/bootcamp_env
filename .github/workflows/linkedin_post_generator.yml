name: LinkedIn Post Generator

on:
  schedule:
    - cron: '0 7 */2 * *'   # Every 2 days, 07:00 UTC = 09:00 CEST / 08:00 CET
  workflow_dispatch:            # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Projects/linkedin_post_generator/requirements.txt

      - name: Generate and send LinkedIn post
        working-directory: Projects/linkedin_post_generator
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.LPG_GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.LPG_GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.LPG_RECIPIENT_EMAIL }}
        run: python linkedin_post_generator.py

      - name: Persist post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Projects/linkedin_post_generator/post_history.json
          git diff --cached --quiet || git commit -m "chore: update linkedin post history [skip ci]"
          git pull --rebase --autostash origin main
          git push
